name: Stage 4 - Link Chrome

on:
  workflow_dispatch:

jobs:
  link-chrome:
    runs-on: windows-2022
    timeout-minutes: 300
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
      
    - name: Restore Chromium source
      uses: actions/cache/restore@v4
      with:
        path: |
          C:\chromium
        key: chromium-src-154.0.6478.126-patched-${{ github.sha }}
        fail-on-cache-miss: true
        
    - name: Restore Stage 3 artifacts
      uses: actions/cache/restore@v4
      with:
        path: |
          C:\chromium\src\out\Release
        key: chromium-build-stage3-${{ github.sha }}
        fail-on-cache-miss: true
        
    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
        
    - name: Link chrome.exe
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        
        cd C:\chromium\src
        
        # 链接最终的chrome.exe
        autoninja -C out\Release chrome
        
        echo "Chrome.exe linked successfully"
      shell: pwsh
      timeout-minutes: 240
      
    - name: Verify chrome.exe
      run: |
        cd C:\chromium\src\out\Release
        
        if (Test-Path "chrome.exe") {
          $fileSize = (Get-Item "chrome.exe").Length / 1MB
          Write-Host "✓ chrome.exe exists ($([math]::Round($fileSize, 2)) MB)"
          
          # 获取文件版本信息
          $version = (Get-Item "chrome.exe").VersionInfo
          Write-Host "  Product: $($version.ProductName)"
          Write-Host "  Version: $($version.ProductVersion)"
        } else {
          Write-Error "✗ chrome.exe not found"
          exit 1
        }
        
        # 检查必要的DLL
        $requiredDlls = @(
          "chrome.dll",
          "libEGL.dll",
          "libGLESv2.dll"
        )
        
        foreach ($dll in $requiredDlls) {
          if (Test-Path $dll) {
            Write-Host "✓ $dll exists"
          } else {
            Write-Warning "✗ $dll missing"
          }
        }
      shell: pwsh
      
    - name: Package Chrome
      run: |
        cd C:\chromium\src\out\Release
        
        # 创建打包目录
        $packageDir = "chrome-fingerprint-browser"
        New-Item -ItemType Directory -Force -Path $packageDir
        
        # 复制必要文件
        Copy-Item -Path "chrome.exe" -Destination $packageDir -Force
        
        # 复制所有DLL
        Get-ChildItem -Path . -Filter "*.dll" | Copy-Item -Destination $packageDir -Force
        
        # 复制资源文件夹
        if (Test-Path "locales") {
          Copy-Item -Path "locales" -Destination $packageDir -Recurse -Force
        }
        
        if (Test-Path "resources") {
          Copy-Item -Path "resources" -Destination $packageDir -Recurse -Force
        }
        
        # 创建版本信息文件
        @"
        Chromium Fingerprint Browser
        =============================
        
        Base Version: 154.0.6478.126
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Build SHA: ${{ github.sha }}
        
        Modifications:
        - Hardware fingerprint injection (25 points)
        - WebGL/Canvas fingerprint injection (45 points)
        - Navigator API modifications (20 points)
        - Network layer modifications (15 points)
        - Behavioral fingerprinting (20 points)
        
        Total: 130+ fingerprint injection points
        
        Usage:
        chrome.exe --fingerprint-config=config.json --user-data-dir=profile_001
        "@ | Out-File -FilePath "$packageDir\VERSION.txt" -Encoding UTF8
        
        # 压缩打包
        Compress-Archive -Path $packageDir -DestinationPath "chrome-fingerprint-browser.zip" -Force
        
        $zipSize = (Get-Item "chrome-fingerprint-browser.zip").Length / 1MB
        Write-Host "Package created: $([math]::Round($zipSize, 2)) MB"
      shell: pwsh
      
    - name: Upload Chrome package
      uses: actions/upload-artifact@v4
      with:
        name: chrome-fingerprint-browser
        path: C:\chromium\src\out\Release\chrome-fingerprint-browser.zip
        retention-days: 90
        
    - name: Upload individual components
      uses: actions/upload-artifact@v4
      with:
        name: chrome-components
        path: |
          C:\chromium\src\out\Release\chrome-fingerprint-browser\chrome.exe
          C:\chromium\src\out\Release\chrome-fingerprint-browser\*.dll
        retention-days: 90
        
    - name: Generate build summary
      run: |
        cd C:\chromium\src\out\Release
        
        echo "### 🎉 Stage 4 Complete - Chrome Built Successfully! ✓" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        
        # Chrome信息
        if (Test-Path "chrome.exe") {
          $chromeSize = (Get-Item "chrome.exe").Length / 1MB
          echo "**Chrome.exe**: $([math]::Round($chromeSize, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
        }
        
        # 包大小
        if (Test-Path "chrome-fingerprint-browser.zip") {
          $packageSize = (Get-Item "chrome-fingerprint-browser.zip").Length / 1MB
          echo "**Package size**: $([math]::Round($packageSize, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
        }
        
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "### 📦 Package Contents" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "- chrome.exe (内核修改版)" >> $env:GITHUB_STEP_SUMMARY
        echo "- chrome.dll (主DLL)" >> $env:GITHUB_STEP_SUMMARY
        echo "- libEGL.dll, libGLESv2.dll (OpenGL支持)" >> $env:GITHUB_STEP_SUMMARY
        echo "- locales/ (语言包)" >> $env:GITHUB_STEP_SUMMARY
        echo "- resources/ (资源文件)" >> $env:GITHUB_STEP_SUMMARY
        echo "- VERSION.txt (版本信息)" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        
        echo "### 🎯 Modifications Applied" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ Hardware fingerprint (CPU/GPU/Memory/Screen)" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ WebGL fingerprint (Vendor/Renderer/Extensions)" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ Canvas noise injection" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ Audio fingerprint" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ Navigator API override" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ WebRTC IP protection" >> $env:GITHUB_STEP_SUMMARY
        echo "- ✅ Geolocation override" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        
        echo "### 🚀 Next Steps" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "1. Download the artifact: **chrome-fingerprint-browser.zip**" >> $env:GITHUB_STEP_SUMMARY
        echo "2. Extract to local machine" >> $env:GITHUB_STEP_SUMMARY
        echo "3. Create fingerprint config JSON files" >> $env:GITHUB_STEP_SUMMARY
        echo "4. Launch with: \`chrome.exe --fingerprint-config=config.json\`" >> $env:GITHUB_STEP_SUMMARY
        echo "5. Test on fingerprint detection websites" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        
        echo "### ✅ Build Complete!" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "Total build time: ~22 hours across 4 stages" >> $env:GITHUB_STEP_SUMMARY
        echo "Ready for commercial deployment!" >> $env:GITHUB_STEP_SUMMARY
      shell: pwsh
